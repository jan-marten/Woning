Pomp:
    - Type: Circulatiepomp
    - Instellingen:
        - Regelingstype: Verschildruk constant (Δp-c)
        - Stand: II (3 meter / 30 kPa)
Thermostaat:
    - Type: Handmatige thermostaat
    - Instellingen:
        - Stand: 1 (28°C)
Verdeler:
    - Type: Vloerverwarmingsverdeler
    - Instellingen:
        - Aantal groepen: 9
        - Groep 1: 90 meter (woonkamer, onder het raam, koude zone)
        - Groep 2: 80 meter (woonkamer)
        - Groep 3: 80 meter (woonkamer)
        - Groep 4: 80 meter (keuken)
        - Groep 5: 90 meter (keuken, bij schuifpui, koude zone)
        - Groep 6: Niet aangesloten
        - Groep 7: Niet aangesloten
        - Groep 8: Niet aangesloten
        - Groep 9: Niet aangesloten
    - De groepen zijn aangelegd met HOH-afstand van 10 cm
    - De installatie is geschikt voor LTV (lage temperatuur) en ZLTV (zeer lage temperatuur verwarming) 

Toelichting pomp:
Verschildruk constant Δp-c (I, II, III)
Aanbeveling bij vloerverwarmingen of bij grote leidingen of alle toepassingen zonder veran-
derlijke buisnetwerkkarakteristiek (bijv. oplaadpompen), alsmede enkele-buis-verwarmings-syste-
men met verwarmingselementen. De regeling houdt de ingestelde opvoerhoogte
constant, onafhankelijk van het getransporteerde debiet. Drie vooraf gedefinieerde
karakteristieken (I, II, III) ter selectie.
Stand I = 2 meter (20kPa);
Stand II = 3 meter (30 kPa) advies stand bij groepslengte tot 90 meter individueel;
Stand III= 4,5 meter (45 kPa) advies stand bij groepslengte tot 120 meter individueel.